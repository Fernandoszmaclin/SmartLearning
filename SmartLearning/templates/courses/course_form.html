{% extends "app_base.html" %}
{% block title %}Nova matéria - SmartLearning{% endblock %}

{% block app %}
<section class="form-narrow reveal is-visible">
  <a class="ac-back" href="{% url 'course_list' %}">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    Voltar para matérias
  </a>
  <h1>Nova matéria</h1>

  <form method="post" class="stack-form">
    {% csrf_token %}
    {% if form.non_field_errors %}<div class="form-error">{{ form.non_field_errors }}</div>{% endif %}

    <label class="field">
      <span>Título</span>
      {{ form.title }}
      {% for e in form.title.errors %}<small class="form-error">{{ e }}</small>{% endfor %}
    </label>
    <label class="field">
      <span>Resumo</span>
      {{ form.summary }}
      {% for e in form.summary.errors %}<small class="form-error">{{ e }}</small>{% endfor %}
    </label>
    <label class="field">
      <span>Nível</span>
      {{ form.level }}
    </label>
    <label class="field">
      <span>Descrição</span>
      {{ form.description }}
    </label>
    <label class="field-check">
      {{ form.is_published }}
      <span>Publicar agora (visível para todos)</span>
    </label>

    <div class="ac-form-actions">
      <button type="submit" class="btn btn-primary">Criar matéria</button>
      <a class="btn btn-secondary" href="{% url 'course_list' %}">Cancelar</a>
    </div>
  </form>
</section>
{% endblock %}
