{% extends "base.html" %}
{% block title %}Entrar - SmartLearning{% endblock %}

{% block content %}
<section class="section">
  <div class="auth-wrap">
    <div class="card auth-card">
      <h1>Bem-vindo de volta</h1>
      <p class="muted-text">Entre na sua área de estudos.</p>

      {% if form.errors %}
        <p class="form-error" role="alert">Usuário ou senha incorretos. Tente de novo.</p>
      {% endif %}

      <form method="post" action="{% url 'login' %}" novalidate>
        {% csrf_token %}
        <label class="field">
          <span>Usuário</span>
          <input class="input" type="text" name="username" autocomplete="username" required autofocus>
        </label>
        <label class="field">
          <span>Senha</span>
          <input class="input" type="password" name="password" autocomplete="current-password" required>
        </label>
        <input type="hidden" name="next" value="{{ next }}">
        <button class="btn btn-primary" type="submit" style="width:100%;">Entrar</button>
      </form>

      <p class="auth-alt">Ainda não tem conta? <a href="{% url 'signup' %}">Crie uma</a></p>
    </div>
  </div>
</section>
{% endblock %}
