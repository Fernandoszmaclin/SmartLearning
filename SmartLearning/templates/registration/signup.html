{% extends "base.html" %}
{% block title %}Criar conta - SmartLearning{% endblock %}

{% block content %}
<section class="section">
  <div class="auth-wrap">
    <div class="card auth-card">
      <h1>Crie sua conta</h1>
      <p class="muted-text">Comece a anotar e a focar hoje.</p>

      <form method="post" action="{% url 'signup' %}" novalidate>
        {% csrf_token %}
        {% for field in form %}
          <label class="field">
            <span>{{ field.label }}</span>
            {{ field }}
            {% if field.help_text %}<small class="help-text">{{ field.help_text|safe }}</small>{% endif %}
            {% for error in field.errors %}<small class="form-error">{{ error }}</small>{% endfor %}
          </label>
        {% endfor %}
        <button class="btn btn-primary" type="submit" style="width:100%;">Criar conta</button>
      </form>

      <p class="auth-alt">Já tem conta? <a href="{% url 'login' %}">Entrar</a></p>
    </div>
  </div>
</section>
{% endblock %}
