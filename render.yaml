services:
  - type: web
    name: smartlearning
    runtime: python
    rootDir: SmartLearning
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn SmartLearning.wsgi:application"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ""
      - key: PYTHON_VERSION
        value: "3.13.0"
      - key: DATABASE_URL
        fromDatabase:
          name: smartlearning-db
          property: connectionString

databases:
  - name: smartlearning-db
    plan: free
